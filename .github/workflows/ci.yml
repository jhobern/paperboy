name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The vendored libcurl/OpenSSL build (see the `curl` dependency in Cargo.toml)
  # dominates a cold build, so a warm cache is the difference between a two
  # minute job and a twenty minute one.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The feature matrix is the point of this job. PaperBoy builds in four shapes
  # and each one has to stay both compiling *and* warning-free on its own:
  #
  #   headless  -- no front-end at all; the shape used in CI images and Docker
  #   tui       -- the default, and what `cargo install paperboy` gives you
  #   gui       -- tui + gui, what `--features gui` gives you
  #   gui-only  -- the GUI without the terminal UI
  #
  # Without this job the non-default shapes rot silently: `gui-only` did not
  # compile at all until the front-ends were split apart, because nothing ever
  # built it. `-D warnings` is deliberate — the dead-code suppression in
  # `main.rs` is keyed on the `tui` feature, and this is what proves the two
  # front-end-complete configurations are still carrying full analysis.
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: headless
            features: --no-default-features
          - name: tui
            features: ""
          - name: gui
            features: --features gui
          - name: gui-only
            features: --no-default-features --features gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # eframe pulls in winit, which needs the X11/Wayland and xkbcommon headers
      # at build time. The terminal and headless shapes need none of this, which
      # is a large part of why the GUI is opt-in in the first place.
      - name: Install GUI build dependencies
        if: contains(matrix.features, 'gui')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo check ${{ matrix.features }} --all-targets
        env:
          RUSTFLAGS: -D warnings

  # Every shape that is built is also tested. The GUI configurations were
  # originally check-only, which left their 432 `gui::*` tests compiled but
  # never run — a shape CI proves builds and nothing more. They need no display
  # to run, so there was nothing bought by leaving them out.
  #
  # None of the four is redundant: headless is the only one proving the core
  # passes with no front-end linked in (what a CI-image user installs), and
  # gui-only is the only one proving the GUI stands on its own.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: headless
            features: --no-default-features
          - name: tui
            features: ""
          - name: gui
            features: --features gui
          - name: gui-only
            features: --no-default-features --features gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      - name: Install GUI build dependencies
        if: contains(matrix.features, 'gui')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      # `paperboy` is a binary crate with no lib target, so the unit tests are
      # compiled into `src/main.rs` and plain `cargo test` is the only form that
      # works (`--lib` fails outright).
      - run: cargo test ${{ matrix.features }}

  # Everything above runs on Linux, which for a long time meant the two
  # platforms a user is most likely to *download* were never compiled at all --
  # "PaperBoy runs on Windows" was a claim resting on nothing, and the first
  # person to test it did so by hand, one missing dependency at a time.
  #
  # Only the `gui` shape is built here. It is a strict superset: the same binary
  # serves `-c`, the terminal UI and `--gui`, so it is both the widest compile
  # and exactly what a release artifact will be. A second shape would double a
  # slow job to prove something the Linux matrix already proves.
  #
  # Neither runner can build this out of the box, and what each is missing is
  # not the same:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # On MSVC, `libxml` asks vcpkg and nothing else. The image ships a vcpkg
      # tree already, so this installs the port rather than bootstrapping one --
      # and `VCPKG_ROOT` is exported because that, not `PATH`, is how vcpkg-rs
      # finds the tree. The triplet must be the `-static-md` one Rust's MSVC
      # target wants; the plain `x64-windows` port installs fine and then reads
      # as missing.
      - name: Install libxml2 (vcpkg)
        if: runner.os == 'Windows'
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install libxml2:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # OpenSSL assembles its Windows primitives with NASM, which is the one
      # prerequisite the image does not carry (it has Perl, LLVM and MSVC). Its
      # installer does not extend PATH either, hence the second line.
      - name: Install NASM
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # hurl 8.0.1's build script embeds a Windows icon from
      # `../../bin/windows/logo.ico`, a path relative to hurl's own git
      # checkout. The crates.io package ships nothing outside its own
      # directory, so on Windows `rc.exe` fails with RC2135 and the build
      # script panics -- hurl as a library simply cannot be built on Windows
      # from crates.io. Upstream fixed it by guarding the path
      # (Orange-OpenSource/hurl#5207, merged 2026-09-14) but has not released
      # it; 8.0.1 is still the newest crate.
      #
      # rc.exe resolves that relative path from the build script's working
      # directory, which Cargo sets to the package root -- so `../../` lands in
      # `registry/src`, and putting a file there is enough to satisfy it. We
      # supply *our own* icon rather than fetching hurl's: the resource is
      # linked into the final executable, so hurl's logo would otherwise become
      # paperboy.exe's icon. Remove this once hurl 8.1.0 is out.
      - name: Work around hurl's unreachable Windows icon (hurl#5207)
        if: runner.os == 'Windows'
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $dir = Join-Path $cargoHome "registry\src\bin\windows"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "assets\windows\paperboy.ico" (Join-Path $dir "logo.ico") -Force

      # macOS has pkgconf but no discoverable libxml2 -- the system copy lives
      # inside the SDK and moves between Xcode releases. Homebrew's is keg-only,
      # so it has to be pointed at explicitly rather than assumed on the path.
      # `LIBXML2_STATIC` matches what release.yml does, so the configuration
      # that ships is the one under test. Without it this job would prove a
      # dynamically linked build works and the release would link differently.
      - name: Install libxml2 (Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install libxml2
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBXML2_STATIC=1" >> "$GITHUB_ENV"

      # `-D warnings` matches the Linux matrix. Platform-gated code (clipboard
      # and terminal handling differ per OS) has never been under it before, so
      # this is the job that will say so.
      - run: cargo test --features gui
        env:
          RUSTFLAGS: -D warnings
