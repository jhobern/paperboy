[package]
name = "paperboy"
version = "0.5.6"
edition = "2024"
description = "A Rust TUI API tester"
readme = "README.md"
repository = "https://github.com/jhobern/paperboy"
license = "MIT"
# A pre-flight probe for the system libxml2 that `hurl` -> `libxml` needs but
# Cargo cannot supply. It only ever prints advice; see build.rs for why it can
# neither prevent the failure nor ask the user anything.
build = "build.rs"

[features]
# Three front-ends share one core, and each is a Cargo feature so a build only
# pays for what it will actually run.
#
# `tui` is the terminal UI and is on by default, because `paperboy` with no
# arguments is a TUI. The headless runner (`-c` / `-r`) is *not* a feature: it
# is always built, since it is the one part every configuration needs. Turning
# `tui` off therefore yields a CLI-only binary — the shape wanted for CI images
# and Docker containers, where a terminal UI is dead weight:
#
#     cargo install paperboy --no-default-features
#
# `gui` is opt-in for the same reason in reverse: it drags in eframe/winit/wgpu
# and the Phosphor font, which dominate build time, and a terminal user should
# not pay for them:
#
#     cargo install paperboy --features gui
#
# Both front-ends draw with ratatui types (the GUI converts the shared `.trail`
# highlighter's ratatui spans into egui sections rather than duplicating the
# rules), so `ratatui` belongs to both rather than to `tui` alone. The
# saved-state format is independent of all of this: `ThemeSpec` is plain RGB, so
# every configuration round-trips every other one's themes and geometry rather
# than dropping them.
default = ["tui"]
tui = [
    "dep:ratatui",
    "dep:ratatui-explorer",
    "dep:tui-panel-select",
    "dep:tui-rgb-picker",
]
gui = [
    "dep:ratatui",
    "dep:eframe",
    "dep:egui_extras",
    "dep:egui-phosphor",
    "dep:rfd",
]


[dependencies]
tui-panel-select = { version = "0.1.6", optional = true }
tui-rgb-picker = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object key order when we pretty-print a response
# body (serde_json otherwise sorts keys). Reports must never silently reorder /
# lose information about a response, so pretty output stays faithful to the wire.
serde_json = { version = "1", features = ["preserve_order"] }
hurl = "~8.0"
hurl_core = "~8.0"
# libcurl reaches the tree transitively via `hurl` -> `curl` -> `curl-sys`. We
# depend on `curl` directly only to enable `static-curl`/`static-ssl`, which make
# curl-sys compile and statically link vendored libcurl + OpenSSL from source
# (via `cc`/`perl`). That removes any need for a system libcurl `-dev` package or
# pkg-config `.pc` (this environment ships neither), so the build is
# self-contained and reproducible rather than relying on a hand-written pkg-config
# shim. Cargo feature-unifies onto the same `curl` crate `hurl` already uses.
curl = { version = "0.4", features = ["static-curl", "static-ssl"] }
base64 = "0.22"
ratatui = { version = "0.30.2", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
# Terminal styling and raw-mode/event handling. Named directly rather than
# reached through ratatui's re-export, because the headless runner colours its
# output too and must keep doing so in a build with no terminal UI. Pinned to
# the 0.29 line ratatui 0.30 uses, so a default build compiles one crossterm
# rather than two.
crossterm = "0.29"
ratatui-explorer = { version = "0.3.0", optional = true }
uuid = { version = "1", features = ["v4"] }
# Randomness for the `# [Gen]` block's nonces and keys. Already compiled as a
# transitive dependency of `uuid`, so naming it directly costs no extra build;
# pure Rust, so it doesn't disturb the no-C-toolchain story `build.rs` guards.
getrandom = "0.3"
# Hashes and HMAC for the `# [Gen]` block's signature functions. RustCrypto, so
# pure Rust with no OpenSSL and no C toolchain — signing must not become the
# reason `cargo install paperboy` needs a build environment. `sha2` is already
# compiled as a transitive dependency; the `0.10`/`0.12` line is the one it and
# `digest 0.10` are on, so these share it rather than duplicating the tree.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
regex = "1"
# Local-time formatting for the report name `{time}` token. `Local` reads the
# system timezone via libc (robust in our multithreaded runner, unlike the
# `time` crate's local-offset guard). Already in the tree via `hurl`.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
# Pure-Rust `.xlsx` writer for report output (no C toolchain needed — its zlib
# is the Rust `zlib-rs`), so it builds cleanly in this libcurl-`-dev`-less
# environment. `default-features = false` drops the optional chrono/serde/polars
# integrations we don't use, keeping the dependency tree small.
rust_xlsxwriter = { version = "0.96.0", default-features = false }
nom = "7.0"
# Native GUI front-end (eframe = egui + winit + wgpu). Shares the same
# front-end-agnostic core (`session`, `request`, `collection`, `environment`,
# `theme`, …) as the terminal UI, so the two never duplicate logic. egui is
# immediate-mode like ratatui, so the panel model and RGB theming map across
# directly. `egui_extras` provides the table/grid builders the panels use.
eframe = { version = "0.35", optional = true }
egui_extras = { version = "0.35", optional = true }
# Phosphor icon font for the GUI. egui's bundled emoji/symbol fonts don't
# actually contain the folder/file/report/key/caret glyphs the tree needs (they
# render as empty "tofu" boxes on many systems), so we register the Phosphor
# icon set at startup and draw all GUI icons from it — guaranteed to render
# regardless of the host's installed fonts. `default-features = false` +
# `light` bundles only the one weight we use — see `gui::app::GuiApp::new` for
# why it's the light one, and `gui::icons` for why only one can be registered.
egui-phosphor = { version = "0.13", default-features = false, optional = true, features = [
    "light",
] }
# Image decoding/encoding. Two jobs: decoding `assets/paperboy_logo.png` into an
# `egui::IconData` / `ColorImage` for the GUI's window icon and status-bar logo,
# and downscaling an `IMAGE` column's pictures for the report writers.
#
# Not GUI-gated, because the writers are core: before this, `IMAGE(HEIGHT 110)`
# was only a CSS/spreadsheet sizing hint and the *full-resolution* file was
# embedded in every row, so a thousand-row report over 2 MB photographs
# produced a file measured in gigabytes.
#
# Pure-Rust `png`/`jpeg` backends only — no C toolchain, matching the rest of
# this self-contained build. (GIF and BMP still embed as-is: they are rare as
# report inputs and each would add another codec to every install.)
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# Native OS file/folder picker for the GUI's open/save flows and any path field
# (collections/workspaces/environments, `FOR … IN FILES/FOLDERS` folders, and
# Form/Multipart File/Base64 values). Default features use the XDG Desktop
# Portal backend via `pollster` (a synchronous `FileDialog`), so it needs no
# system GTK `-dev` libraries — matching the rest of this self-contained build.
# The terminal UI keeps its own in-app browser overlay (the right UX for a
# terminal); rfd is GUI-only.
rfd = { version = "0.17", default-features = false, optional = true, features = [
    "xdg-portal",
    "wayland",
] }
