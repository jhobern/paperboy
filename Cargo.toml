[package]
name = "paperboy"
version = "0.1.6"
edition = "2024"
description = "A Rust TUI API tester"
readme = "README.md"
repository = "https://github.com/jhobern/paperboy"
license = "MIT"


[dependencies]
tui-panel-select = "0.1.4"
tui-rgb-picker = "0.1"
tui-line-editor = { version = "0.1.2", path = "../../PaperBoyTUI/paperboy-tui/crates/tui-line-editor" }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object key order when we pretty-print a response
# body (serde_json otherwise sorts keys). Reports must never silently reorder /
# lose information about a response, so pretty output stays faithful to the wire.
serde_json = { version = "1", features = ["preserve_order"] }
hurl = "~8.0"
hurl_core = "~8.0"
base64 = "0.22"
ratatui = "0.30.2"
clap = { version = "4.6.1", features = ["derive"] }
ratatui-explorer = "0.3.0"
uuid = { version = "1", features = ["v4"] }
regex = "1"
