[package]
name = "paperboy"
version = "0.3.1"
edition = "2024"
description = "A Rust TUI API tester"
readme = "README.md"
repository = "https://github.com/jhobern/paperboy"
license = "MIT"

[features]
# The terminal UI and the headless runner are always built. The native GUI is
# opt-in because it drags in eframe/winit/wgpu and the Phosphor font, which
# together dominate build time — a cost a user who only wants `paperboy` in a
# terminal should not pay:
#
#     cargo install paperboy --features gui
#
# Everything the GUI needs is optional and enabled only by this feature; the
# saved-state format is unaffected, so a terminal-only build still round-trips
# a GUI user's window/panel geometry rather than dropping it.
default = []
gui = [
    "dep:eframe",
    "dep:egui_extras",
    "dep:egui-phosphor",
    "dep:image",
    "dep:rfd",
]


[dependencies]
tui-panel-select = "0.1.5"
tui-rgb-picker = "0.1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object key order when we pretty-print a response
# body (serde_json otherwise sorts keys). Reports must never silently reorder /
# lose information about a response, so pretty output stays faithful to the wire.
serde_json = { version = "1", features = ["preserve_order"] }
hurl = "~8.0"
hurl_core = "~8.0"
# libcurl reaches the tree transitively via `hurl` -> `curl` -> `curl-sys`. We
# depend on `curl` directly only to enable `static-curl`/`static-ssl`, which make
# curl-sys compile and statically link vendored libcurl + OpenSSL from source
# (via `cc`/`perl`). That removes any need for a system libcurl `-dev` package or
# pkg-config `.pc` (this environment ships neither), so the build is
# self-contained and reproducible rather than relying on a hand-written pkg-config
# shim. Cargo feature-unifies onto the same `curl` crate `hurl` already uses.
curl = { version = "0.4", features = ["static-curl", "static-ssl"] }
base64 = "0.22"
ratatui = "0.30.2"
clap = { version = "4.6.1", features = ["derive"] }
ratatui-explorer = "0.3.0"
uuid = { version = "1", features = ["v4"] }
regex = "1"
# Local-time formatting for the report name `{time}` token. `Local` reads the
# system timezone via libc (robust in our multithreaded runner, unlike the
# `time` crate's local-offset guard). Already in the tree via `hurl`.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
# Pure-Rust `.xlsx` writer for report output (no C toolchain needed — its zlib
# is the Rust `zlib-rs`), so it builds cleanly in this libcurl-`-dev`-less
# environment. `default-features = false` drops the optional chrono/serde/polars
# integrations we don't use, keeping the dependency tree small.
rust_xlsxwriter = { version = "0.96.0", default-features = false }
nom = "7.0"
# Native GUI front-end (eframe = egui + winit + wgpu). Shares the same
# front-end-agnostic core (`session`, `request`, `collection`, `environment`,
# `theme`, …) as the terminal UI, so the two never duplicate logic. egui is
# immediate-mode like ratatui, so the panel model and RGB theming map across
# directly. `egui_extras` provides the table/grid builders the panels use.
eframe = { version = "0.35", optional = true }
egui_extras = { version = "0.35", optional = true }
# Phosphor icon font for the GUI. egui's bundled emoji/symbol fonts don't
# actually contain the folder/file/report/key/caret glyphs the tree needs (they
# render as empty "tofu" boxes on many systems), so we register the Phosphor
# icon set at startup and draw all GUI icons from it — guaranteed to render
# regardless of the host's installed fonts. `default-features = false` +
# `regular` bundles only the one weight we use.
egui-phosphor = { version = "0.13", default-features = false, optional = true, features = [
    "regular",
] }
# PNG decoding for the application/window icon and the status-bar logo. Already
# in the tree transitively (egui image support); declared directly so we can
# decode `assets/paperboy_logo.png` into an `egui::IconData` / `ColorImage`.
# Pure-Rust `png` backend only — no C toolchain, matching the rest of the build.
image = { version = "0.25", default-features = false, optional = true, features = [
    "png",
] }
# Native OS file/folder picker for the GUI's open/save flows and any path field
# (collections/workspaces/environments, `FOR … IN FILES/FOLDERS` folders, and
# Form/Multipart File/Base64 values). Default features use the XDG Desktop
# Portal backend via `pollster` (a synchronous `FileDialog`), so it needs no
# system GTK `-dev` libraries — matching the rest of this self-contained build.
# The terminal UI keeps its own in-app browser overlay (the right UX for a
# terminal); rfd is GUI-only.
rfd = { version = "0.17", default-features = false, optional = true, features = [
    "xdg-portal",
    "wayland",
] }
